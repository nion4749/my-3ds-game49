name: Build 3DSX

on:
  push:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    container: devkitpro/devkit3ds:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Game
        run: |
          git config --global --add safe.directory '*'
          make

      - name: Upload Game ROM
        uses: actions/upload-artifact@v4
        with:
          name: my-3ds-rom
          path: |
            *.3dsx

