name: Build 3DSX

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build game
        run: |
          make

      - name: Upload 3DSX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-3ds-game
          path: "*.3dsx"
