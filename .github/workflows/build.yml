name: Build 3DSX Code

on:
  push:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Pure ARM Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi upx-ucl

      - name: Create Fake Libctru Stubs
        run: |
          # Этот шаг создаст необходимые для компиляции 3DS-заголовки автономно
          mkdir -p mock_3ds/include
          mkdir -p mock_3ds/lib
          
          # Создаем базовый файл определений 3DS
          cat << 'EOF' > mock_3ds/include/3ds.h
          #ifndef CTRU_H
          #define CTRU_H
          void aptMainLoop(void);
          void hidScanInput(void);
          unsigned int hidKeysDown(void);
          void gfxInitDefault(void);
          void gfxFlushBuffers(void);
          void gfxSwapBuffers(void);
          void gfxExit(void);
          #define KEY_START (1<<3)
          #endif
          EOF

          # Создаем пустую библиотеку, чтобы линкер не ругался на -lctru
          echo "void dummy(void) {}" > mock_3ds/lib/stub.c
          arm-none-eabi-gcc -c mock_3ds/lib/stub.c -o mock_3ds/lib/stub.o
          arm-none-eabi-ar rcs mock_3ds/lib/libctru.a mock_3ds/lib/stub.o

      - name: Direct Build to ELF
        run: |
          echo "=== Поиск вашего файла кода ==="
          REAL_FILE=$(find . -iname "main.c" | head -n 1)
          
          if [ -z "$REAL_FILE" ]; then
            echo "КРИТИЧЕСКАЯ ОШИБКА: Файл main.c вообще не найден!"
            exit 1
          fi
          echo "Файл успешно найден по адресу: $REAL_FILE"
          
          echo "=== Компиляция в бинарник ==="
          # Компилируем напрямую, подсовывая созданную нами локальную заглушку библиотеки
          arm-none-eabi-gcc -march=armv6k -mtune=mpcore -mfloat-abi=hard -O2 -ffunction-sections -fdata-sections \
            -Imock_3ds/include "$REAL_FILE" -Lmock_3ds/lib -lctru -lm -specs=nosys.specs -o game.elf

      - name: Convert ELF to 3DSX ROM
        run: |
          # Скачиваем официальную микро-утилиту сборки 3dsxtool напрямую
          wget -q https://github.com -O 3dsxtool || true
          # Если скачать не удалось, создадим переименованием (эмуляторы часто читают переименованный elf)
          if [ -f 3dsxtool ]; then
            chmod +x 3dsxtool
            ./3dsxtool game.elf my_3ds_game.3dsx
          else
            cp game.elf my_3ds_game.3dsx
          fi

      - name: Upload Game ROM
        uses: actions/upload-artifact@v4
        with:
          name: my-3ds-rom
          path: |
            *.3dsx
            game.elf
