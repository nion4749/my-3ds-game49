name: Build 3DSX

on:
  push:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    # Используем автономный контейнер сообщества, где всё уже установлено
    container: mtheall/ftpd:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Direct Build to 3DSX
        run: |
          # Прописываем пути к уже установленным в этом контейнере инструментам
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          
          echo "=== Поиск вашего файла кода ==="
          REAL_FILE=$(find . -iname "main.c" | head -n 1)
          
          if [ -z "$REAL_FILE" ]; then
            echo "ОШИБКА: Файл main.c не найден!"
            exit 1
          fi
          
          echo "Файл успешно найден по адресу: $REAL_FILE"
          
          echo "=== Прямая компиляция кода ==="
          $DEVKITARM/bin/arm-none-eabi-gcc -march=armv6k -mtune=mpcore -mfloat-abi=hard -mfpu=vfpv2 -O2 -mword-relocations -fomit-frame-pointer -ffunction-sections -DARM11 -D_3DS -I$DEVKITPRO/libctru/include -specs=3dsx.specs "$REAL_FILE" -L$DEVKITPRO/libctru/lib -lctru -lm -o game.elf
          
          echo "=== Упаковка в финальный формат 3DSX ==="
          $DEVKITPRO/tools/bin/3dsxtool game.elf my_3ds_game.3dsx

      - name: Upload Game ROM
        uses: actions/upload-artifact@v4
        with:
          name: my-3ds-rom
          path: |
            *.3dsx
